name: PAGDOC backend tests
on:
  push:
    paths:
      - "backend/**"
      - "*.html"
      - "assets/**"
      - "tests/**"
      - "package*.json"
      - "deployment/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "*.html"
      - "assets/**"
      - "tests/**"
      - "package*.json"
      - "deployment/**"
      - ".github/workflows/backend-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pagdoc_ci
          POSTGRES_PASSWORD: pagdoc_ci_password
          POSTGRES_DB: pagdoc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PAGDOC_ENVIRONMENT: test
      PAGDOC_SECRET_KEY: ci-only-not-for-production-secret-at-least-32-characters
      PAGDOC_ENCRYPTION_KEY: mFmtvXGV6G9z6uAQo4-EyWzZi-DLZfHototZ6LtCL_4=
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install tested dependency pins
        run: python -m pip install -r requirements.lock
      - name: Verify dependency integrity
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Guard public repository from private artifacts and common secrets
        run: python repo_guard.py ..
      - name: Validate schema migration on SQLite
        env:
          PAGDOC_DATABASE_URL: sqlite:///./ci_schema_validation.sqlite3
        run: python -m alembic upgrade head
      - name: Validate schema migration on PostgreSQL
        env:
          PAGDOC_DATABASE_URL: postgresql+psycopg://pagdoc_ci:pagdoc_ci_password@localhost:5432/pagdoc_ci
        run: python -m alembic upgrade head
      - name: Verify PostgreSQL backup and restore
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -U pagdoc_ci -d pagdoc_ci -c "INSERT INTO tenants (name) VALUES ('CI Backup Tenant');"
          docker exec "$PG_CONTAINER" pg_dump -U pagdoc_ci -Fc -f /tmp/pagdoc_ci.dump pagdoc_ci
          docker exec "$PG_CONTAINER" dropdb -U pagdoc_ci pagdoc_ci
          docker exec "$PG_CONTAINER" createdb -U pagdoc_ci pagdoc_ci
          docker exec "$PG_CONTAINER" pg_restore -U pagdoc_ci -d pagdoc_ci /tmp/pagdoc_ci.dump
          test "$(docker exec "$PG_CONTAINER" psql -U pagdoc_ci -d pagdoc_ci -tAc "SELECT count(*) FROM tenants WHERE name='CI Backup Tenant';")" = "1"
      - name: Run backend regression tests
        run: python -m pytest -q test_app.py test_runtime_config.py test_ops_api.py test_query_api.py test_retention_api.py test_security_hardening.py test_storage.py test_file_gateway.py test_file_records.py test_requirements_engine.py test_requirements_api.py test_document_history.py test_alerts_api.py test_audit_integrity.py test_operations_api.py test_private_operations_ui.py test_sharepoint_adapter.py test_clamav_scanner.py
      - name: Test authenticated private backup format
        run: python -m pytest -q test_private_backup.py
      - name: Run private server smoke test
        run: python -m pytest -q test_private_server_smoke.py
      - name: Test local secret generation
        run: python -m pytest -q test_local_deployment.py
      - name: Run PostgreSQL concurrency tests
        env:
          PAGDOC_DATABASE_URL: postgresql+psycopg://pagdoc_ci:pagdoc_ci_password@localhost:5432/pagdoc_ci
        run: python -m pytest -q test_postgres_concurrency.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check assets/operations.js
      - run: npm test

  private-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Parse Windows launcher
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deployment/windows/PAGDOC.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Write-Error; exit 1 }
      - name: Generate private CI configuration
        run: python3 deployment/local/generate_config.py "$RUNNER_TEMP/pagdoc-private/runtime.env"
      - name: Validate local composition and start containers
        run: |
          docker compose --env-file "$RUNNER_TEMP/pagdoc-private/runtime.env" -f deployment/local/compose.local.yml config --quiet
          docker compose --env-file "$RUNNER_TEMP/pagdoc-private/runtime.env" -f deployment/local/compose.local.yml up --build --detach --wait --wait-timeout 240
      - name: Provision fictional administrator and verify HTTPS
        run: |
          docker compose --env-file "$RUNNER_TEMP/pagdoc-private/runtime.env" -f deployment/local/compose.local.yml exec -T api python - <<'PY'
          import server
          import app as core
          from provision_admin import provision
          with core.SessionLocal() as db:
              provision(db,'Fictitious private CI tenant','private-pilot@example.invalid','ci-only-private-pilot-password')
              db.commit()
          PY
          docker compose --env-file "$RUNNER_TEMP/pagdoc-private/runtime.env" -f deployment/local/compose.local.yml exec -T proxy cat /data/caddy/pki/authorities/local/root.crt > "$RUNNER_TEMP/pagdoc-private/root.crt"
          python3 deployment/local/smoke.py "$RUNNER_TEMP/pagdoc-private/root.crt"
      - name: Stop temporary CI services
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/pagdoc-private/runtime.env" -f deployment/local/compose.local.yml down

  antimalware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Generate isolated diagnostic configuration
        run: python3 deployment/local/generate_config.py "$RUNNER_TEMP/pagdoc-private/runtime.env"
      - name: Start private API and actual ClamAV
        run: docker compose --env-file "$RUNNER_TEMP/pagdoc-private/runtime.env" -f deployment/local/compose.local.yml --profile files up --build --detach --wait --wait-timeout 600
      - name: Check real clean and antivirus test verdicts and encrypted storage
        run: docker compose --env-file "$RUNNER_TEMP/pagdoc-private/runtime.env" -f deployment/local/compose.local.yml exec -T api python private_files.py
      - name: Seed only fictitious records for backup recovery check
        run: |
          docker compose --env-file "$RUNNER_TEMP/pagdoc-private/runtime.env" -f deployment/local/compose.local.yml exec -T api python - <<'PY'
          import server
          import app as core
          from provision_admin import provision
          from private_files import configured_gateway
          from file_records import store_new_file_version
          with core.SessionLocal() as db:
              user_id = provision(db,'Fictitious backup tenant','backup-admin@example.invalid','ci-only-fictitious-backup-account')
              db.commit()
              user = db.get(core.User,user_id)
              doc = core.Document(tenant_id=user.tenant_id,title='Fictitious backup evidence',subject_type='company',subject_name='Fictitious company')
              db.add(doc)
              db.commit()
              store_new_file_version(db,user,doc.id,configured_gateway(),'fictitious.pdf','application/pdf',b'%PDF-1.7\n% fictitious backup evidence\n%%EOF')
          PY
      - name: Install isolated backup test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/pagdoc-backup-env"
          "$RUNNER_TEMP/pagdoc-backup-env/bin/python" -m pip install cryptography==46.0.7
      - name: Verify encrypted backup and actual isolated recovery
        run: |
          "$RUNNER_TEMP/pagdoc-backup-env/bin/python" deployment/local/backup_ci.py "$RUNNER_TEMP/pagdoc-private/runtime.env" "$RUNNER_TEMP/private-backups"
      - name: Stop temporary diagnostic services
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/pagdoc-private/runtime.env" -f deployment/local/compose.local.yml --profile files down
