name: pagdoc-private
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: pagdoc
      POSTGRES_USER: pagdoc
      POSTGRES_PASSWORD: ${PAGDOC_POSTGRES_PASSWORD:?Generate private configuration first}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pagdoc -d pagdoc']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: ../..
      dockerfile: deployment/Dockerfile
    environment:
      PAGDOC_ENVIRONMENT: staging
      PAGDOC_DATABASE_URL: ${PAGDOC_DATABASE_URL:?Generate private configuration first}
      PAGDOC_SECRET_KEY: ${PAGDOC_SECRET_KEY:?Generate private configuration first}
      PAGDOC_ENCRYPTION_KEY: ${PAGDOC_ENCRYPTION_KEY:?Generate private configuration first}
      PAGDOC_PUBLIC_ORIGIN: https://localhost:8443
      PAGDOC_STORAGE_ROOT: /var/lib/pagdoc-files
      PAGDOC_CLAMAV_HOST: antimalware
      PAGDOC_BINARY_HTTP_ENABLED: ${PAGDOC_BINARY_HTTP_ENABLED:-0}
      PAGDOC_EMAIL_DELIVERY_ENABLED: ${PAGDOC_EMAIL_DELIVERY_ENABLED:-0}
      PAGDOC_SMTP_HOST: ${PAGDOC_SMTP_HOST:-}
      PAGDOC_SMTP_PORT: ${PAGDOC_SMTP_PORT:-587}
      PAGDOC_SMTP_USERNAME: ${PAGDOC_SMTP_USERNAME:-}
      PAGDOC_SMTP_PASSWORD: ${PAGDOC_SMTP_PASSWORD:-}
      PAGDOC_PASSWORD_RESET_URL: ${PAGDOC_PASSWORD_RESET_URL:-https://localhost:8443/app}
      PAGDOC_SMTP_FROM: ${PAGDOC_SMTP_FROM:-}
    volumes: [file_objects:/var/lib/pagdoc-files]
    command: [sh, -c, 'python -m alembic upgrade head && exec uvicorn server:app --host 0.0.0.0 --port 8000 --no-access-log']
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready',timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
    restart: unless-stopped
  notifications:
    extends:
      service: api
    profiles: [notifications]
    command: [python, notification_worker.py]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: false
      test: [CMD, python, -c, "from pathlib import Path; import time; p=Path('/tmp/pagdoc-notifications-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 1800"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  analysis:
    extends:
      service: api
    profiles: [files]
    command: [python, analysis_worker.py]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 32
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; import time; p=Path('/tmp/pagdoc-analysis-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime < 300"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  antimalware:
    image: clamav/clamav:1.4
    profiles: [files]
    volumes: [clamav_signatures:/var/lib/clamav]
    environment:
      CLAMAV_NO_MILTERD: 'true'
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_AlertEncryptedArchive: 'yes'
      CLAMD_CONF_AlertEncryptedDoc: 'yes'
      CLAMD_CONF_StreamMaxLength: 50M
      CLAMD_CONF_MaxScanSize: 100M
      CLAMD_CONF_MaxFileSize: 50M
      CLAMD_CONF_MaxRecursion: '16'
      CLAMD_CONF_MaxFiles: '1000'
      CLAMD_CONF_MaxThreads: '2'
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
    # The image supplies a ClamD healthcheck. No antivirus port is published.
    restart: unless-stopped
  proxy:
    image: caddy:2
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  caddy_data:
  caddy_config:
  file_objects:
  clamav_signatures:
